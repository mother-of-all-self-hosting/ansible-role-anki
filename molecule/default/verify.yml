---
- name: Verify Anki synchronization server
  hosts: all
  become: true
  gather_facts: false

  vars:
    anki_probe_base_url: "http://127.0.0.1:{{ anki_container_http_port }}"

  tasks:
    # Read the version the role pins, rather than restating it here, so that a
    # bump of `anki_version` cannot leave this assertion checking a stale value.
    # Only leaf literals can be read this way; everything derived from them
    # (`anki_container_image` and friends) is Jinja and would fail on access.
    - name: Read Anki synchronization server role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: anki_role_defaults

    - name: Wait for the Anki synchronization server systemd service to become active (up to 180s)
      ansible.builtin.systemd:
        name: anki.service
      register: anki_service
      until: anki_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    # `Restart=always` keeps a crash-looping container's unit "active", so this
    # says little on its own - it is here to fail fast and readably when the
    # unit was never installed or enabled at all.
    - name: Assert the Anki synchronization server systemd service is active
      ansible.builtin.assert:
        that: anki_service.status.ActiveState == 'active'
        fail_msg: "anki.service is not active ({{ anki_service.status.ActiveState }})"
        success_msg: "anki.service is active"

    - name: Retrieve the Anki synchronization server container's image reference
      ansible.builtin.command:
        cmd: docker inspect --format {% raw %}'{{ .Config.Image }}'{% endraw %} anki
      register: anki_container_image_result
      changed_when: false
      retries: 36
      delay: 5
      until: anki_container_image_result.rc == 0

    # The server has no version surface of its own: it takes no arguments,
    # reports no version at startup or over the protocol, and the image's
    # `org.opencontainers.image.version` label reads a literal `latest}`. The
    # honest claim available is that the container which answers the sync
    # requests below was created from the image tag the role pins.
    - name: Assert the Anki synchronization server container runs the pinned version
      ansible.builtin.assert:
        that: anki_container_image_result.stdout | trim == expected_image
        fail_msg: "Expected the container to run {{ expected_image }}, found {{ anki_container_image_result.stdout | trim }}"
        success_msg: "The container runs {{ expected_image }}"
      vars:
        expected_image: "ghcr.io/luckyturtledev/anki:{{ anki_role_defaults.anki_version }}"

    - name: Retrieve the Anki synchronization server container's mount destinations
      ansible.builtin.command:
        cmd: docker inspect --format {% raw %}'{{ range .Mounts }}{{ .Destination }} {{ end }}'{% endraw %} anki
      register: anki_container_mounts_result
      changed_when: false

    # `anki_container_additional_volumes_custom` used to replace the data
    # directory mount instead of adding to it. This scenario configures one, so
    # both destinations have to be present.
    - name: Assert the Anki synchronization server container mounts both the data directory and the additional volume
      ansible.builtin.assert:
        that:
          - anki_container_data_path in anki_container_mounts_result.stdout.split()
          - anki_molecule_extra_volume_path_container in anki_container_mounts_result.stdout.split()
        fail_msg: "Expected {{ anki_container_data_path }} and {{ anki_molecule_extra_volume_path_container }} to be mounted, found {{ anki_container_mounts_result.stdout | trim }}"
        success_msg: "The container mounts {{ anki_container_mounts_result.stdout | trim }}"

    # Reaching the server on this port at all is part of what is being asserted:
    # it is not the server's own default, so only `SYNC_PORT` from the role's
    # environment file can have put it there. The readiness condition is
    # deliberately no more than "the server answers", so that each assertion
    # below fails at its own task instead of starving this loop.
    - name: Wait for the Anki synchronization server to answer on the configured port (up to 5m)
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/anki-sync-probe
          --base-url {{ anki_probe_base_url }}
          --username {{ anki_environment_variables_username | quote }}
          --password {{ anki_environment_variables_password | quote }}
      register: anki_probe_result
      changed_when: false
      retries: 60
      delay: 5
      until: anki_probe_result.rc == 0 and (anki_probe_result.stdout | from_json).health_status == 200

    - name: Register the Anki synchronization server sync probe result
      ansible.builtin.set_fact:
        anki_probe: "{{ anki_probe_result.stdout | from_json }}"

    - name: Show the Anki synchronization server sync probe result
      ansible.builtin.debug:
        var: anki_probe

    - name: Assert the Anki synchronization server accepts the configured credentials
      ansible.builtin.assert:
        that:
          - anki_probe.login_status == 200
          - anki_probe.login_key_length == 40
        fail_msg: "Logging in as {{ anki_environment_variables_username }} returned {{ anki_probe.login_status }} with a {{ anki_probe.login_key_length }}-character key"
        success_msg: "Logging in as {{ anki_environment_variables_username }} returned a sync key"

    # Without this, the login above would also pass against a server which
    # accepts anybody, which is what a mis-rendered `SYNC_USER1` would look like
    # if the server had a permissive fallback.
    - name: Assert the Anki synchronization server rejects a wrong password and an unknown user
      ansible.builtin.assert:
        that:
          - anki_probe.wrong_password_status == 403
          - anki_probe.unknown_user_status == 403
        fail_msg: "Expected 403 for a wrong password and an unknown user, got {{ anki_probe.wrong_password_status }} and {{ anki_probe.unknown_user_status }}"
        success_msg: "Wrong credentials are rejected with 403"

    - name: Assert the Anki synchronization server serves collection metadata to a logged-in client
      ansible.builtin.assert:
        that:
          - anki_probe.meta_status == 200
          - anki_probe.meta.scm | int > 0
          - anki_probe.meta.cont
          - anki_probe.forged_key_status == 403
        fail_msg: "sync/meta returned {{ anki_probe.meta_status }} ({{ anki_probe.meta | default('no body') }}), and {{ anki_probe.forged_key_status }} for a forged key"
        success_msg: "sync/meta returned collection metadata and rejects a forged key"

    # `/health` answers 200 with an empty body on any instance, configured or
    # not, so it is recorded rather than trusted; the 404 on `/` is what says
    # there is no catch-all page which could have made a naive probe look
    # healthy on a server that is not really there.
    - name: Assert the Anki synchronization server exposes only what it should
      ansible.builtin.assert:
        that:
          - anki_probe.health_status == 200
          - anki_probe.root_status == 404
        fail_msg: "/health returned {{ anki_probe.health_status }} and / returned {{ anki_probe.root_status }}"
        success_msg: "/health returns 200 and / returns 404"

    - name: Check the Anki synchronization server collection file on the host
      ansible.builtin.stat:
        path: "{{ anki_data_path }}/{{ anki_environment_variables_username }}/collection.anki2"
      register: anki_collection_stat

    - name: Read the head of the Anki synchronization server collection file
      when: anki_collection_stat.stat.exists | bool
      ansible.builtin.slurp:
        src: "{{ anki_data_path }}/{{ anki_environment_variables_username }}/collection.anki2"
      register: anki_collection_head

    # The metadata request above makes the server open (and therefore create)
    # the collection of the logged-in user. Finding it here proves the bind
    # mount and `SYNC_BASE` agree, and that the collections of a real user would
    # survive the container being recreated.
    - name: Assert the Anki synchronization server keeps the collection in the role's data path
      ansible.builtin.assert:
        that:
          - anki_collection_stat.stat.exists
          - (anki_collection_head.content | b64decode)[0:15] == 'SQLite format 3'
        fail_msg: "No SQLite collection at {{ anki_data_path }}/{{ anki_environment_variables_username }}/collection.anki2"
        success_msg: "The collection of {{ anki_environment_variables_username }} is an SQLite database under {{ anki_data_path }}"

    - name: Retrieve the Anki synchronization server service log for debugging
      when: anki_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu anki.service
      changed_when: false
