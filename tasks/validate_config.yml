---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "anki_http_header_content_permission_policy", "new": "anki_http_header_permissions_policy" }
    - { "old": "anki_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Anki synchronization server settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - anki_uid
    - anki_gid
    - anki_hostname
    - anki_path_prefix
    - anki_container_network
    - anki_environment_variables_username
    - anki_environment_variables_password

# The image built from `docs/syncserver/Dockerfile` in the Anki repository is
# not a drop-in replacement for the pre-built one this role defaults to. Its
# entrypoint starts as `root`, creates a group and a user, chowns the data
# directory and only then drops privileges with `su-exec`; it also force-exports
# `SYNC_BASE=/anki_data` and `SYNC_PORT=8080`, overriding whatever the role puts
# in the environment file. None of that survives the hardened container this
# role runs (`--user`, `--cap-drop=ALL`, `--read-only`), which was confirmed by
# running that image with exactly the role's flags: it dies immediately with
# `addgroup: permission denied (are you root?)`, before the server ever starts.
- name: Fail if self-building of the Anki synchronization server container image is enabled
  when: anki_container_image_self_build | bool
  ansible.builtin.fail:
    msg: >-
      Self-building the Anki synchronization server container image
      (`anki_container_image_self_build: true`) does not work and never produced
      a running server. The image built from `docs/syncserver/Dockerfile` in the
      Anki repository requires starting as `root` so that its entrypoint can
      create a user and chown the data directory, and it insists on keeping its
      collections in `/anki_data`, while this role runs the container as
      `{{ anki_uid }}:{{ anki_gid }}` with `--cap-drop=ALL --read-only` and
      mounts the data directory at `{{ anki_container_data_path }}`.
      Please remove `anki_container_image_self_build` from your configuration
      and use the pre-built image (`{{ anki_container_image }}`).

- name: Run if Traefik is enabled
  when: anki_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Anki synchronization server are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "anki_container_labels_traefik_hostname", when: true }
        - { "name": "anki_container_labels_traefik_path_prefix", when: true }
        - { "name": "anki_container_labels_traefik_middleware_basic_auth_users", when: "{{ anki_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `anki_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if anki_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          anki_container_labels_traefik_path_prefix (`{{ anki_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/anki`).
      when: "anki_container_labels_traefik_path_prefix != '/' and anki_container_labels_traefik_path_prefix[-1] == '/'"
